name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit tests
        run: pytest tests -m "not integration"

  integration:
    name: Database integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: riksdag_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/riksdag_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build schemas and tables
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/riksdag_test" \
            -v ON_ERROR_STOP=1 -f sql/00_init.sql
          for f in sql/[1-3]*.sql; do
            echo "--- $f"
            psql "postgresql://postgres:postgres@localhost:5432/riksdag_test" \
              -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify init script is idempotent
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/riksdag_test" \
            -v ON_ERROR_STOP=1 -f sql/00_init.sql

      - name: Integration tests
        run: pytest tests -m integration -v
