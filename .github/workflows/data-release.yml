name: Data release

# Continuous Delivery for the warehouse.
#
# Restores the previous release into a fresh Postgres, runs the pipeline
# incrementally against data.riksdagen.se, and publishes the result as a new
# release. Because the ingest is resumable, a run that fails partway still
# banks its progress: the artifact is published regardless, and the next run
# continues from where it stopped.
#
# First run has no previous release and bootstraps from scratch (~30-45 min).
# Subsequent runs fetch only new voteringar and take a couple of minutes.

on:
  schedule:
    # 04:15 UTC daily. Scheduled runs are queued, not precise, and can be
    # delayed or dropped at peak times - nothing here depends on exact timing.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Ignore the previous release and rebuild from scratch"
        type: boolean
        default: false

# Never let a long bootstrap and a scheduled run race on the same release tag.
concurrency:
  group: data-release
  cancel-in-progress: false

permissions:
  contents: write        # required to create releases

jobs:
  build-and-publish:
    name: Build warehouse and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: riksdag
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: riksdag
      PGUSER: postgres
      PGPASSWORD: postgres
      PGCONN: postgresql://postgres:postgres@localhost:5432/riksdag
      # `python scripts/x.py` puts scripts/ on sys.path, not the repo root,
      # so `from src.common...` fails without this.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyarrow

      - name: Install postgresql-client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

# Restores state so the incremental load has something to compare against.
      # Errors are NOT suppressed here: a silent failure means a 45-minute
      # bootstrap instead of a two-minute incremental run, so we want to see it.
      - name: Download previous release
        id: previous
        if: ${{ !inputs.bootstrap }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- Releases visible to this job:"
          gh release list --limit 10 || echo "(gh release list failed)"

          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' 2>&1 || true)
          echo "--- Latest release tag: '${TAG:-<none>}'"

          if [ -z "$TAG" ]; then
            echo "No release found - bootstrapping from scratch."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "--- Assets on $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"' || true

          echo "--- Downloading riksdag-db.pgc from $TAG"
          if gh release download "$TAG" --pattern "riksdag-db.pgc" --dir . --clobber; then
            ls -lh riksdag-db.pgc
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Download FAILED - see the error above. Bootstrapping instead."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Restore previous state
        if: steps.previous.outputs.found == 'true'
        run: |
          pg_restore --no-owner --no-privileges -d "$PGCONN" riksdag-db.pgc
          psql "$PGCONN" -c "SELECT 'stg.votering' AS tabell, count(*) FROM stg.votering;"

      # ---------------------------------------------------------------
      # Apply DDL. Idempotent, so it is safe over a restored database and
      # it picks up any new tables added since the last release.
      # ---------------------------------------------------------------
      - name: Apply schema and DDL
        run: |
          psql "$PGCONN" -v ON_ERROR_STOP=1 -f sql/00_init.sql
          for f in sql/[1-3]*.sql; do
            echo "--- $f"
            psql "$PGCONN" -v ON_ERROR_STOP=1 -f "$f"
          done

      # ---------------------------------------------------------------
      # The ingest is resumable: if an API call fails midway, rows already
      # written stay written and the next run resumes from there. So a
      # failure here must NOT stop us publishing - otherwise a partial
      # bootstrap is discarded and we start over every night.
      # ---------------------------------------------------------------
      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        run: python -m src.run_pipeline

      # Reports on whatever tables exist. A table that has not been created
      # yet (dw.fakta_rost, for example) is reported as missing rather than
      # failing the job - an incomplete warehouse must still publish.
      - name: Row counts
        run: |
          : > counts.txt
          for t in stg.person stg.person_uppdrag stg.person_uppgift \
                   stg.votering dw.dim_ledamot dw.dim_parti dw.fakta_rost; do
            exists=$(psql "$PGCONN" -At -c "SELECT to_regclass('$t') IS NOT NULL")
            if [ "$exists" = "t" ]; then
              n=$(psql "$PGCONN" -At -c "SELECT count(*) FROM $t")
            else
              n="saknas"
            fi
            printf '%-26s %s\n' "$t" "$n" >> counts.txt
          done
          cat counts.txt

      # ---------------------------------------------------------------
      # Two artifacts, two consumers:
      #   riksdag-db.pgc  - state for the next run. Restores in seconds.
      #   *.parquet       - for the reports. No database needed to read them.
      # ---------------------------------------------------------------
      - name: Dump database
        run: |
          pg_dump -d "$PGCONN" -Fc -Z6 -f riksdag-db.pgc
          ls -lh riksdag-db.pgc

      - name: Export Parquet
        run: |
          python scripts/export_artifacts.py --out artifacts/
          ls -lh artifacts/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$(date -u +%Y-%m-%d-%H%M)"
          STATUS="${{ steps.pipeline.outcome }}"
          {
            echo "Warehouse built $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo ""
            echo "Pipeline step: **$STATUS**"
            if [ "$STATUS" != "success" ]; then
              echo ""
              echo "The pipeline did not complete. Rows fetched before the failure"
              echo "are included; the next run resumes from that point."
            fi
            echo ""
            echo '```'
            cat counts.txt
            echo '```'
            echo ""
            echo "**riksdag-db.pgc** - full database dump, restored by the next run."
            echo "**\*.parquet** - warehouse tables for reports:"
            echo ""
            echo '```python'
            echo 'import pandas as pd'
            echo "df = pd.read_parquet('https://github.com/${{ github.repository }}/releases/latest/download/dw_dim_ledamot.parquet')"
            echo '```'
            echo ""
            echo "Källa: Sveriges riksdag"
          } > notes.md

          gh release create "$TAG" \
            --title "Warehouse $TAG" \
            --notes-file notes.md \
            riksdag-db.pgc artifacts/*.parquet

      # Publish first, then surface the failure. Red build, progress kept.
      - name: Fail if the pipeline did not complete
        if: steps.pipeline.outcome != 'success'
        run: |
          echo "Pipeline step failed - artifact published with partial data."
          exit 1